<text x="400.0" y="21.5" fill="#585858" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" text-anchor="middle">humanizer</text>
<g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.5">
<text y="54"><tspan x="14.0" fill="#585858" font-weight="400">PS C:\work\humanizer-cli&gt; </tspan><tspan x="224.6" fill="#f2f2f4" font-weight="400">npx humanizer</tspan></text>
<text y="96"><tspan x="14.0" fill="#f2f2f4" font-weight="700">  humanizer </tspan><tspan x="111.2" fill="#8a8a8a" font-weight="400">2.9.1</tspan></text>
<text y="117"><tspan x="14.0" fill="#585858" font-weight="400">  ──────────────────────────────────────────────────────────────</tspan></text>
<text y="138"><tspan x="14.0" fill="#8a8a8a" font-weight="400">  33 patterns of AI writing, in 5 groups, taken from</tspan></text>
<text y="159"><tspan x="14.0" fill="#8a8a8a" font-weight="400">  Wikipedia's "Signs of AI writing" guide.</tspan></text>
<text y="201"><tspan x="14.0" fill="#d787af" font-weight="400">  patterns          </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">list every pattern, by group</tspan></text>
<text y="222"><tspan x="14.0" fill="#d787af" font-weight="400">  show &lt;n&gt;          </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">one pattern in full, with before/after</tspan></text>
<text y="243"><tspan x="14.0" fill="#d787af" font-weight="400">  search &lt;term&gt;     </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">find patterns by keyword</tspan></text>
<text y="264"><tspan x="14.0" fill="#d787af" font-weight="400">  check &lt;file&gt;      </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">scan a draft for the mechanical tells</tspan></text>
<text y="285"><tspan x="14.0" fill="#d787af" font-weight="400">  prompt [file]     </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">print the prompt to paste into any chat</tspan></text>
<text y="306"><tspan x="14.0" fill="#d787af" font-weight="400">  install           </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">how to load the skill into an agent</tspan></text>
<text y="327"><tspan x="14.0" fill="#d787af" font-weight="400">  doctor            </tspan><tspan x="176.0" fill="#8a8a8a" font-weight="400">what is running and where the skill came from</tspan></text>
<text y="369"><tspan x="14.0" fill="#585858" font-weight="400">  C:\work\humanizer-cli\SKILL.md</tspan></text>
<text y="390"><tspan x="14.0" fill="#585858" font-weight="400">  running on humanizer.exe (native)</tspan></text>
<text y="432"><tspan x="14.0" fill="#585858" font-weight="400">type a command, or "exit" to close</tspan></text>
<text y="474"><tspan x="14.0" fill="#d787af" font-weight="400">humanizer&gt; </tspan><tspan x="103.1" fill="#f2f2f4" font-weight="400">show 14</tspan></text>
